name: 데이터 갱신 및 GitHub Pages 배포

on:
  schedule:
    # 평일 KST 09:00, 15:00 (=UTC 00:00, 06:00). 장 시작/장중 기준. 필요시 조정.
    - cron: "0 0,6 * * 1-5"
  workflow_dispatch: {}   # Actions 탭에서 수동 실행 가능
  push:
    branches: [main]
    paths:
      # web/data/**는 이 워크플로우 자신이 커밋하는 대상이라 제외 — 포함시키면 매 실행마다
      # 스스로를 재트리거하는 무한루프가 될 수 있다(기본 GITHUB_TOKEN은 재트리거를 막아주지만
      # 방어적으로 경로도 분리해둔다).
      - "web/index.html"
      - "web/easy.html"
      - "web/css/**"
      - "web/js/**"
      - "automation/**"
      - "common/**"
      - ".claude/skills/**"
      - ".github/workflows/update-and-deploy.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 변경 범위 확인 (데이터 재생성이 필요한 변경인지)
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            data_logic:
              - 'automation/**'
              - 'common/**'
              - '.claude/skills/**'
              - '.github/workflows/update-and-deploy.yml'

      - name: DART 원본 응답 캐시 복원/보존
        # 확정 공시된 재무제표는 불변이라, 한 번 받은 원본(output/cache/raw)을 실행 간에 보존하면
        # 계산 로직만 바꾸는 수정 시 DART를 거의 재호출하지 않는다(70분+ → 수 분). key에 run_id를 넣어
        # 매 실행 끝에 갱신본을 저장하고, restore-keys 접두어로 직전 실행의 캐시를 이어받는다.
        uses: actions/cache@v4
        with:
          path: output/cache/raw
          key: dart-raw-${{ github.run_id }}
          restore-keys: |
            dart-raw-

      - name: 데이터 생성 (technical/fundamental/attention → web/data)
        # 정기 스케줄/수동 실행은 항상 재생성. push 트리거는 데이터 생성 로직(automation/common/skills)이
        # 바뀐 경우에만 재생성한다 — web/*.html, css, js 같은 순수 UI 변경까지 매번 DART·pykrx를
        # 전종목 재조회하면 커밋 하나에 15~30분씩 걸려 낭비가 크다(실측으로 확인됨).
        id: generate
        if: github.event_name != 'push' || steps.filter.outputs.data_logic == 'true'
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python automation/generate_all.py
        # 일부 종목/스캔 실패는 generate_all.py 내부에서 스킵+로그 처리되어 여기서 중단되지 않는다.
        # 전 단계가 실패했을 때만 이 스텝이 실패로 표시된다(automation/generate_all.py 참조) —
        # 그 경우에도 아래 커밋/배포는 계속 진행해 직전 성공분(git에 남아있는 web/data)이 계속 서빙되게 한다.
        # (실패 자체는 조용히 넘기지 않음 — 다음 스텝이 Step Summary에 경고를 남긴다.)
        continue-on-error: true

      - name: 생성 결과 확인
        env:
          DATA_REGENERATED: ${{ github.event_name != 'push' || steps.filter.outputs.data_logic == 'true' }}
        run: |
          if [ "$DATA_REGENERATED" != "true" ]; then
            echo "UI 전용 변경이라 데이터 재생성을 건너뛰었습니다 — 기존 web/data 그대로 배포합니다."
          fi
          if [ "${{ steps.generate.outcome }}" = "failure" ]; then
            echo "### ⚠️ 데이터 생성 전면 실패" >> "$GITHUB_STEP_SUMMARY"
            echo "generate_all.py의 모든 단계가 실패했습니다. 직전 성공분으로 계속 배포하지만," >> "$GITHUB_STEP_SUMMARY"
            echo "DART/네이버 API 장애나 키 만료가 원인일 수 있으니 로그를 확인해주세요." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "=== web/data 내용 ==="
          find web/data -type f | sort
          if [ -f web/data/meta.json ]; then cat web/data/meta.json; fi

      - name: 생성된 데이터 커밋 (변경 있을 때만)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore: 대시보드 데이터 자동 갱신 $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            # 재생성 실행 중(수십 분) 코드 커밋 등으로 main이 이동하면 단순 push가 거부돼 재계산분이
            # 통째로 유실됐다(커밋 스텝 실패→배포 skip). 데이터 커밋은 web/data만 건드리고 코드 커밋과
            # 경로가 겹치지 않으므로 rebase 후 재시도하면 안전하게 반영된다.
            pushed=""
            for i in 1 2 3 4 5; do
              if git push; then pushed=1; break; fi
              echo "push 거부됨 — 원격 변경 rebase 후 재시도 ($i/5)"
              git pull --rebase origin main || break
              sleep $((i * 3))
            done
            # 5회 재시도 후에도 실패하면 이번 실행의 재계산 결과는 원격에 반영되지 못한 것 —
            # 조용히 다음 스텝(배포)으로 넘어가면 아무 신호 없이 유실되므로 스텝을 실패로 표시한다.
            # (아래 배포 스텝들은 if: always()라 이 실패와 무관하게 방금 만든 web/data로 계속 배포된다.)
            if [ -z "$pushed" ]; then
              echo "### ⚠️ 데이터 커밋 push 실패" >> "$GITHUB_STEP_SUMMARY"
              echo "5회 재시도 후에도 원격에 반영하지 못했습니다. 이번 실행의 재계산분은 다음 실행 전까지" >> "$GITHUB_STEP_SUMMARY"
              echo "git에 저장되지 않습니다(사이트 자체는 이번 결과로 정상 배포됩니다)." >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          fi

      - name: Pages 아티팩트 업로드
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: GitHub Pages 배포
        if: always()
        id: deployment
        uses: actions/deploy-pages@v4
